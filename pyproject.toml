[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collaborative-ai-workboard"
version = "0.1.0"
description = "A WORK.md board that people and AI agents can share: claim rows, work locally, land a batch in one push."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
board = "workboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workboard = ["templates/*"]
